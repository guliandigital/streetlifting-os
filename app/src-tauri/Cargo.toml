[package]
name = "streetlifting-os"
version = "1.1.0"
description = "Streetlifting OS — offline-first ISF Streetlifting & Calisthenics meet client"
authors = ["Streetlifting OS Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "streetlifting_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-updater = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# V2: ed25519-dalek = "2.1"  # Save-file signing per D38
# V2: sha2 = "0.10"            # Hash for tamper detection

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
