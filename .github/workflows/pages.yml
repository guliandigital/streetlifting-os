name: Deploy PWA to GitHub Pages

# DISABLED — the repository was switched from public to private after the
# v0.1.0 release, and the GitHub Pages site was removed automatically.
# GitHub Pages requires a paid plan (Pro / Team / Enterprise) for private
# repositories — on Free, `POST /repos/.../pages` returns:
#   422 "Your current plan does not support GitHub Pages for this repository."
#
# Re-enable when EITHER:
#   1. The repo is made public again (Settings → General → Change visibility),
#      then `gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow`
#      to re-create the Pages site;
#   2. The account is upgraded to GitHub Pro or above, and Pages enabled in
#      Settings → Pages → Source = GitHub Actions.
# Then restore the `push: branches: [main]` trigger below.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one Pages deploy at a time; new pushes wait for the current one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build PWA
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Generate icons
        working-directory: app
        run: npm run icons:generate

      - name: Build PWA
        working-directory: app
        env:
          # GitHub Pages serves the project under /<repo>/, so the build needs that base.
          VITE_PUBLIC_BASE: /streetlifting-os/
        run: npm run build

      - name: Setup Pages
        # The Pages site was created at v0.1.0 (Settings → Pages → Source =
        # "GitHub Actions"). Don't try to recreate it on every run — the action
        # 404s on Get Pages and the GITHUB_TOKEN cannot Create Pages without
        # repo-admin scope, so the workflow fails. Use `enablement: false`
        # (the default) to assume the existing config.
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
