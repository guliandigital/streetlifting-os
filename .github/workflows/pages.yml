name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one Pages deploy at a time; new pushes wait for the current one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build PWA
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Generate icons
        working-directory: app
        run: npm run icons:generate

      - name: Build PWA
        working-directory: app
        env:
          # GitHub Pages serves the project under /<repo>/, so the build needs that base.
          VITE_PUBLIC_BASE: /streetlifting-os-legacy/
        run: npm run build

      - name: Validate PWA artifact
        working-directory: app
        env:
          VITE_PUBLIC_BASE: /streetlifting-os-legacy/
        run: npm run pwa:validate

      - name: Setup Pages
        # The Pages site is provisioned once through the GitHub Pages API
        # (build_type=workflow). Runtime deploys should only configure the
        # existing site and upload the current PWA artifact.
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
