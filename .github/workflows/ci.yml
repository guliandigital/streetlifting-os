name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

# Least-privilege default token: this workflow only reads source and produces
# ephemeral build output. Per-job permissions can escalate explicitly when
# needed. (https://docs.github.com/actions/security-guides/automatic-token-authentication)
permissions:
  contents: read

# Cancel superseded runs on the same ref to save Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + tests + build
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        # --max-old-space-size=4096 prevents worker OOM crash when 23+ test files
        # run in parallel (vitest uses Node worker_threads per file).
        run: npm run test -- --run
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Lint
        run: npm run lint

      - name: Vite production build
        run: npm run build
