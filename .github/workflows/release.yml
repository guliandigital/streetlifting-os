name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

# Don't let two release builds for the same tag step on each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tauri:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64 — MSI + NSIS)
            target: ""
            args: ""
          - os: macos-latest
            label: macOS (universal — DMG)
            target: universal-apple-darwin
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            label: Linux (x64 — AppImage + DEB)
            target: ""
            args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: ${{ matrix.os }}-${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Generate icons (PNG/ICO via sharp)
        working-directory: app
        run: npm run icons:generate

      - name: Generate macOS .icns via Tauri CLI
        if: runner.os == 'macOS'
        working-directory: app
        run: npx @tauri-apps/cli icon ../docs/brand/logo-placeholder.svg

      - name: Build Tauri app + create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code-signing (deferred to v0.2.0+; secrets unset = unsigned build)
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code-signing (deferred — see docs/release-process-v1.md §Code-signing)
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Streetlifting OS ${{ github.ref_name }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/GulianDigital/streetlifting-os/blob/main/CHANGELOG.md) for the full list of changes in this release.

            **Installation guides:**
            - Windows: [docs/installation-v1.md#windows](https://github.com/GulianDigital/streetlifting-os/blob/main/docs/installation-v1.md#windows)
            - macOS: [docs/installation-v1.md#macos](https://github.com/GulianDigital/streetlifting-os/blob/main/docs/installation-v1.md#macos)
            - Linux: [docs/installation-v1.md#linux](https://github.com/GulianDigital/streetlifting-os/blob/main/docs/installation-v1.md#linux)
            - Browser PWA: <https://guliandigital.github.io/streetlifting-os/>

            **Note:** binaries are unsigned in the v0.x series. See installation guides for the OS-specific "open anyway" flow (Windows SmartScreen, macOS Gatekeeper).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
