name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

# Default token scope is read-only at workflow level; the build-tauri job
# escalates to `contents: write` for release-asset upload (job-level
# permissions block below).
permissions:
  contents: read

# Don't let two release builds for the same tag step on each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tauri:
    name: Build ${{ matrix.label }}
    permissions:
      contents: write   # required to create/update GitHub releases and upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64 — MSI + NSIS)
            rust-targets: ""
            cache-key-suffix: windows
            args: ""
          - os: macos-latest
            label: macOS (universal — DMG)
            # `universal-apple-darwin` is a meta-target that has no rust-std
            # component of its own — Tauri builds both x86_64 and aarch64,
            # then `lipo`s them together, so we install both real targets.
            rust-targets: "x86_64-apple-darwin,aarch64-apple-darwin"
            cache-key-suffix: macos-universal
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            label: Linux (x64 — AppImage + DEB)
            rust-targets: ""
            cache-key-suffix: linux
            args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: ${{ matrix.cache-key-suffix }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        working-directory: app
        # --ignore-scripts avoids esbuild postinstall binary-validation failure
        # on macOS runners (tsx@4.x bundles esbuild@0.27; its postinstall crashes
        # on macOS 14 + Node 24 with "Unknown system error -88").  tsx itself
        # works fine at runtime — only its postinstall is affected.
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Generate icons (PNG/ICO via sharp)
        working-directory: app
        run: npm run icons:generate

      - name: Generate macOS .icns via Tauri CLI
        if: runner.os == 'macOS'
        working-directory: app
        run: npx @tauri-apps/cli icon ../docs/brand/logo-placeholder.svg

      - name: Normalize updater signing key
        shell: bash
        env:
          INPUT_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import base64
          import os
          import re

          raw = os.environ.get("INPUT_TAURI_SIGNING_PRIVATE_KEY", "")
          value = raw

          try:
              compact = re.sub(r"\s+", "", raw)
              decoded = base64.b64decode(compact, validate=True).decode("utf-8")
              if decoded.startswith("untrusted comment:") and "secret key" in decoded.splitlines()[0]:
                  value = decoded
          except Exception:
              pass

          key_path = os.path.join(os.environ["RUNNER_TEMP"], "tauri-updater-signing.key")
          with open(key_path, "w", encoding="utf-8", newline="\n") as key_file:
              key_file.write(value.rstrip("\n"))
              key_file.write("\n")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"TAURI_SIGNING_PRIVATE_KEY={key_path}\n")
              env_file.write(f"TAURI_SIGNING_PRIVATE_KEY_PATH={key_path}\n")
          PY

      - name: Build Tauri app + create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ─── Auto-updater signing ────────────────────────────────────────
          # Required for `bundle.createUpdaterArtifacts: true`. Tauri signs
          # each updater artefact (`.sig` next to the bundle) with the Ed25519
          # private key matching the `pubkey` baked into tauri.conf.json.
          # Without these env vars the build fails with "minisign: no
          # signing key configured".
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ─── OS code-signing (deferred — costs $$ + legal entity per D40.4) ──
          # macOS code-signing — Apple Developer ID required ($99/yr).
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code-signing — EV cert required (~$300/yr, USB token).
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Streetlifting OS ${{ github.ref_name }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/GulianDigital/streetlifting-os/blob/main/CHANGELOG.md) for the full list of changes in this release.

            **Installation guides:**
            - Windows: [docs/installation-v1.md#windows](https://github.com/GulianDigital/streetlifting-os/blob/main/docs/installation-v1.md#windows)
            - macOS: [docs/installation-v1.md#macos](https://github.com/GulianDigital/streetlifting-os/blob/main/docs/installation-v1.md#macos)
            - Linux: [docs/installation-v1.md#linux](https://github.com/GulianDigital/streetlifting-os/blob/main/docs/installation-v1.md#linux)
            - Browser PWA: <https://streetlifting.app/>

            **Note:** updater artifacts are Ed25519-signed, but OS code-signing is still deferred. Windows SmartScreen and macOS Gatekeeper warnings are expected until Windows EV and Apple Developer ID certificates are connected.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
